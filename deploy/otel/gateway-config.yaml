# Central OTel Gateway. It requires every incoming agent to present a client
# certificate signed by the configured client CA.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp/mtls:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otel/tls/tls.crt
          key_file: /etc/otel/tls/tls.key
          client_ca_file: /etc/otel/tls/client-ca.crt
          client_ca_file_reload: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheusremotewrite:
    endpoint: "${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}"
  otlphttp/loki:
    endpoint: "${env:LOKI_OTLP_ENDPOINT}"
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp/mtls]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp/mtls]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
