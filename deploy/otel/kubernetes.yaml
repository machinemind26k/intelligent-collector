apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-agent
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "nodes/pods", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-agent
subjects:
  - kind: ServiceAccount
    name: otel-node-agent
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-agent
  namespace: observability
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: otel-node-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-node-agent }
    spec:
      serviceAccountName: otel-node-agent
      hostNetwork: true
      hostPID: true
      tolerations: [{ operator: Exists }]
      containers:
        - name: collector
          image: ghcr.io/your-org/observability-collector:0.1.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - { name: ACCOUNT_ID, value: "ACC-001" }
            - { name: SITE_ID, value: "SITE-001" }
            - { name: AGENT_ID, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: K8S_CLUSTER_NAME, value: "REPLACE_ME" }
            - { name: K8S_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: MY_POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: OTEL_GATEWAY_ENDPOINT, value: "otel-gateway.observability.svc:4317" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
            - { name: tls, mountPath: /etc/otel/tls, readOnly: true }
            - { name: hostfs, mountPath: /hostfs, readOnly: true }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: storage, mountPath: /var/lib/otelcol }
      volumes:
        - { name: config, configMap: { name: otel-node-agent-config } }
        - { name: tls, secret: { secretName: otel-node-agent-tls } }
        - { name: hostfs, hostPath: { path: /, type: Directory } }
        - { name: varlogpods, hostPath: { path: /var/log/pods, type: DirectoryOrCreate } }
        - { name: storage, hostPath: { path: /var/lib/otel-node-agent, type: DirectoryOrCreate } }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: otel-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: otel-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-gateway }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - { name: PROMETHEUS_REMOTE_WRITE_ENDPOINT, value: "http://prometheus.observability.svc:9090/api/v1/write" }
            - { name: LOKI_OTLP_ENDPOINT, value: "http://loki.observability.svc:3100/otlp" }
          ports: [{ containerPort: 4317, name: otlp-grpc }, { containerPort: 13133, name: health }]
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
            - { name: tls, mountPath: /etc/otel/tls, readOnly: true }
      volumes:
        - { name: config, configMap: { name: otel-gateway-config } }
        - { name: tls, secret: { secretName: otel-gateway-tls } }
